name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux (JVM, Wasm, linuxX64, API check, examples)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 17 is the compilation toolchain, 21 runs the Gradle daemon.
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Check and run the examples
        timeout-minutes: 45
        run: ./gradlew check :examples:run

      # Both READMEs' diagrams, the diagrams page, and every diagram the freer-trace tests
      # generated, through Mermaid's own parser. The runner's Node runs it; the packages go outside the checkout.
      - name: Parse the diagrams with Mermaid
        timeout-minutes: 5
        run: |
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/mermaid" mermaid@11 jsdom@29
          cp .github/scripts/parse-mermaid.mjs "$RUNNER_TEMP/mermaid/"
          node "$RUNNER_TEMP/mermaid/parse-mermaid.mjs" README.md freer-trace/README.md examples/README.md freer-trace/build/diagrams/from-tests.md

      # Fails below the mutation score threshold set in freer/build.gradle.kts.
      - name: Mutation-test the JVM classes
        timeout-minutes: 15
        run: ./gradlew :freer:pitest

  # The API reference: the KDoc of both published modules, rendered by Dokka and published to GitHub Pages.
  # The README links to it, so the README job below waits for this one.
  pages:
    name: API reference (Dokka to GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Render the KDoc of both modules
        timeout-minutes: 20
        run: ./gradlew :dokkaGenerate

      # Enables Pages with the Actions build type on first use, if the token is allowed to.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

      - id: deploy
        uses: actions/deploy-pages@v5

  # The READMEs' structure and links. Their code blocks and the API names they use are checked
  # by `check` in the Linux job (:examples:runReadme and :freer:checkReadmeIdentifiers).
  readme:
    name: README (markdownlint, links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pages
    if: ${{ !cancelled() && (needs.pages.result == 'success' || needs.pages.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7

      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            README.md
            freer-trace/README.md
            examples/README.md

      # The ACM Digital Library, behind doi.org, answers link checkers with 403.
      - uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: --no-progress --exclude doi.org README.md freer-trace/README.md examples/README.md

  macos:
    name: macOS (macOS and iOS simulator tests, all Apple targets)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Test on macOS and the iOS simulator, assemble every target
        timeout-minutes: 75
        run: ./gradlew :freer:macosArm64Test :freer:iosSimulatorArm64Test :freer:assemble

  windows:
    name: Windows (mingwX64 tests)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~\.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The first run also downloads the MinGW toolchain that Kotlin/Native links with.
      - name: Test on Windows
        timeout-minutes: 75
        run: ./gradlew :freer:mingwX64Test

  jcstress:
    name: JCStress (JVM concurrency stress tests, quick mode)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # The harness forks a JVM per test and configuration; quick mode keeps the whole run
      # to a few minutes on the runner's cores.
      - name: Run the JCStress tests
        timeout-minutes: 30
        run: ./gradlew :jcstress:run
